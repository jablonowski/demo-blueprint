<header class="login-header">
  <h1 class="login-title">Welcome back</h1>
  <p class="login-subtitle">Sign in to your account to continue</p>
</header>

<form class="login-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <dsb-input
    formControlName="username"
    label="Username"
    placeholder="Enter your username"
    [hasError]="showError('username') || invalidCredentials"
    [errorMessage]="invalidCredentials ? 'Invalid username or password' : 'Username is required'"
  />

  <dsb-input
    formControlName="password"
    type="password"
    label="Password"
    placeholder="Enter your password"
    [hasError]="showError('password')"
    errorMessage="Password is required"
  />

  <div class="login-row">
    <dsb-checkbox label="Remember me" />
    <a class="login-link" href="#" (click)="$event.preventDefault()">Forgot password?</a>
  </div>

  <dsb-button type="submit" variant="primary" [fullWidth]="true">Sign In</dsb-button>

  <p class="login-signup">
    Don't have an account?
    <a class="login-link" href="#" (click)="$event.preventDefault()">Sign up</a>
  </p>
</form>
