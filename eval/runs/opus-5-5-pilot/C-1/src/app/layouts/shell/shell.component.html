<div class="shell" (click)="onShellLinkClick($event)">
  <div class="shell-header">
    <dsb-header brandName="Blueprint" logoAlt="Blueprint home" logoHref="/dashboard" [navItems]="navItems()" />

    <div class="shell-header-overlay">
      <div class="profile" #profileMenu>
        <button
          type="button"
          class="profile-trigger"
          aria-haspopup="menu"
          [attr.aria-expanded]="menuOpen()"
          aria-controls="profile-menu"
          (click)="toggleMenu()"
        >
          <dsb-avatar [name]="userName" size="sm" />
          <span class="profile-name">{{ userName }}</span>
          <svg class="profile-caret" [class.profile-caret--open]="menuOpen()" viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        @if (menuOpen()) {
          <div id="profile-menu" class="profile-menu" role="menu" aria-label="User menu">
            <button type="button" class="profile-menu-item" role="menuitem" (click)="closeMenu()">My Profile</button>
            <div class="profile-menu-divider" role="separator"></div>
            <button type="button" class="profile-menu-item profile-menu-item--danger" role="menuitem" (click)="signOut()">Sign Out</button>
          </div>
        }
      </div>
    </div>
  </div>

  <main class="shell-main">
    <router-outlet />
  </main>

  <dsb-footer
    brandName="Blueprint"
    logoHref="/dashboard"
    tagline="Infrastructure monitoring and team management for modern product teams."
    [columns]="footerColumns"
    [copyright]="copyright"
    [legalLinks]="legalLinks"
  />
</div>
