<form class="login" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="login__intro">
    <h1 class="login__title">Welcome back</h1>
    <p class="muted">Sign in to your account to continue</p>
  </div>

  <div class="field">
    <label class="field__label" for="username">Username</label>
    <input
      id="username"
      class="input"
      type="text"
      formControlName="username"
      placeholder="Enter your username"
      autocomplete="username"
      [class.input--error]="showError('username') || invalidCredentials()"
    />
    @if (showError('username')) {
      <span class="field__error">Username is required</span>
    }
  </div>

  <div class="field">
    <label class="field__label" for="password">Password</label>
    <input
      id="password"
      class="input"
      type="password"
      formControlName="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      [class.input--error]="showError('password') || invalidCredentials()"
    />
    @if (showError('password')) {
      <span class="field__error">Password is required</span>
    } @else if (invalidCredentials()) {
      <span class="field__error">Invalid username or password</span>
    }
  </div>

  <div class="login__row">
    <label class="checkbox"><input type="checkbox" /> Remember me</label>
    <a href="#" class="link" (click)="$event.preventDefault()">Forgot password?</a>
  </div>

  <button type="submit" class="btn btn--primary btn--block">Sign In</button>

  <p class="login__signup muted">
    Don't have an account?
    <a href="#" class="link" (click)="$event.preventDefault()">Sign up</a>
  </p>
</form>
