<div class="shell">
  <div class="shell-header" (click)="onShellClick($event)">
    <dsb-header brandName="Blueprint Console" logoAlt="Blueprint Console home" logoHref="/dashboard" [navItems]="navItems()" />

    <div class="shell-header-end">
      <div class="profile" #profile>
        <button
          type="button"
          class="profile-trigger"
          aria-haspopup="menu"
          [attr.aria-expanded]="menuOpen()"
          aria-controls="profile-menu"
          (click)="toggleMenu()"
        >
          <dsb-avatar [name]="userName" size="sm" />
          <span class="profile-name">{{ userName }}</span>
          <svg class="profile-chevron" [class.profile-chevron--open]="menuOpen()" viewBox="0 0 10 6" fill="none" aria-hidden="true">
            <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        @if (menuOpen()) {
          <ul id="profile-menu" class="profile-menu" role="menu" aria-label="User menu">
            <li role="none">
              <button type="button" role="menuitem" class="profile-menu-item" (click)="openProfile()">My Profile</button>
            </li>
            <li role="none">
              <button type="button" role="menuitem" class="profile-menu-item" (click)="signOut()">Sign Out</button>
            </li>
          </ul>
        }
      </div>
    </div>
  </div>

  <main class="shell-main">
    <router-outlet />
  </main>

  <div (click)="onShellClick($event)">
    <dsb-footer
      brandName="Blueprint Console"
      logoHref="/dashboard"
      tagline="Infrastructure monitoring and team management."
      [columns]="footerColumns"
      [copyright]="'© ' + year + ' Blueprint Console. All rights reserved.'"
      [legalLinks]="legalLinks"
    />
  </div>
</div>
