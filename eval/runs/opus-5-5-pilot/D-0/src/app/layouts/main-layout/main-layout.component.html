<div class="shell">
  <div class="shell-header" (click)="onShellLinkClick($event)">
    <dsb-header [brandName]="brandName" logoAlt="Blueprint home" logoHref="/dashboard" [navItems]="navItems" />

    <div class="header-overlay">
      <div class="profile">
        <button
          type="button"
          class="profile-trigger"
          aria-haspopup="menu"
          [attr.aria-expanded]="menuOpen"
          aria-controls="profile-menu"
          (click)="toggleMenu()"
        >
          <dsb-avatar [name]="userName" size="sm" />
          <span class="profile-name">{{ userName }}</span>
          <svg class="profile-chevron" [class.profile-chevron--open]="menuOpen" viewBox="0 0 10 6" fill="none" aria-hidden="true">
            <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        @if (menuOpen) {
          <ul id="profile-menu" class="profile-menu" role="menu" aria-label="User menu">
            <li role="none">
              <button type="button" role="menuitem" class="profile-menu-item" (click)="closeMenu()">My Profile</button>
            </li>
            <li role="none">
              <button type="button" role="menuitem" class="profile-menu-item" (click)="signOut()">Sign Out</button>
            </li>
          </ul>
        }
      </div>
    </div>
  </div>

  <main class="shell-main">
    <div class="shell-content">
      <router-outlet />
    </div>
  </main>

  <div (click)="onShellLinkClick($event)">
    <dsb-footer
      [brandName]="brandName"
      logoHref="/dashboard"
      tagline="Infrastructure monitoring and team management."
      [columns]="footerColumns"
      [copyright]="copyright"
      [legalLinks]="legalLinks"
    />
  </div>
</div>
