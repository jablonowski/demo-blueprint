<form class="login" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="login__intro">
    <h1 class="login__title">Welcome back</h1>
    <p class="text-muted">Sign in to your account to continue</p>
  </div>

  <div class="login__fields">
    <div class="field">
      <label class="field__label" for="username">Username</label>
      <input id="username" class="input" [class.input--error]="hasError('username')" type="text"
             formControlName="username" placeholder="Enter your username" autocomplete="username" />
      @if (hasError('username')) {
        <span class="field__error">Username is required</span>
      }
    </div>

    <div class="field">
      <label class="field__label" for="password">Password</label>
      <input id="password" class="input" [class.input--error]="hasError('password')" type="password"
             formControlName="password" placeholder="Enter your password" autocomplete="current-password" />
      @if (hasError('password')) {
        <span class="field__error">
          {{ invalidCredentials ? 'Invalid username or password' : 'Password is required' }}
        </span>
      }
    </div>

    <div class="login__row">
      <label class="checkbox"><input type="checkbox" /> Remember me</label>
      <a class="link" role="button" tabindex="0">Forgot password?</a>
    </div>
  </div>

  <button class="btn btn--primary btn--block" type="submit">Sign In</button>

  <p class="login__signup text-muted">Don't have an account? <a class="link" role="button" tabindex="0">Sign up</a></p>
</form>
