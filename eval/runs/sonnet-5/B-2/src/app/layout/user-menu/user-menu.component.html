<div class="user-menu">
  <button type="button" class="trigger" (click)="toggle()" [attr.aria-expanded]="open">
    <dsb-avatar [name]="userName" size="sm" shape="circle" />
    <span class="user-name">{{ userName }}</span>
    <svg class="chevron" [class.chevron--open]="open" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  @if (open) {
    <div class="menu-panel" role="menu">
      <dsb-list>
        <dsb-list-item label="My Profile" (click)="onProfile()" role="menuitem" />
        <dsb-list-item label="Sign Out" (click)="onSignOut()" role="menuitem" />
      </dsb-list>
    </div>
  }
</div>
