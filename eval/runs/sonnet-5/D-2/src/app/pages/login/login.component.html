<div class="login-page">
  <div class="login-card">
    <h1 class="login-heading">Welcome back</h1>
    <p class="login-subtitle">Sign in to your account to continue</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
      <dsb-input
        label="Username"
        placeholder="Enter your username"
        formControlName="username"
        [hasError]="hasError('username')"
        errorMessage="Username is required."
      />
      <dsb-input
        label="Password"
        type="password"
        placeholder="Enter your password"
        formControlName="password"
        [hasError]="hasError('password')"
        errorMessage="Password is required."
      />

      <div class="login-options-row">
        <dsb-checkbox label="Remember me" />
        <a class="forgot-link" href="#">Forgot password?</a>
      </div>

      @if (loginFailed()) {
        <p class="login-failed">Invalid username or password.</p>
      }

      <dsb-button type="submit" variant="primary" size="lg" [fullWidth]="true">Sign In</dsb-button>
    </form>

    <hr class="login-divider" />

    <p class="signup-row">
      Don't have an account? <a class="signup-link" href="#">Sign up</a>
    </p>
  </div>
</div>
