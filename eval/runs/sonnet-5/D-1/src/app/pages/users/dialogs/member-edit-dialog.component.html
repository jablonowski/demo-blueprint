<dsb-modal
  [open]="open"
  title="Edit Member"
  size="md"
  [closeOnBackdrop]="true"
  (openChange)="onOpenChange($event)"
>
  @if (member) {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="edit-body" novalidate>
      <div class="user-row">
        <dsb-avatar [name]="member.name" size="md" />
        <div class="user-row-info">
          <span class="user-row-name">{{ member.name }}</span>
          <span class="user-row-meta">Member since {{ memberSince }}</span>
        </div>
      </div>

      <div class="field-grid">
        <dsb-input
          label="First name"
          formControlName="firstName"
          [hasError]="submitted && form.controls.firstName.invalid"
          errorMessage="First name is required."
        />
        <dsb-input
          label="Last name"
          formControlName="lastName"
          [hasError]="submitted && form.controls.lastName.invalid"
          errorMessage="Last name is required."
        />
      </div>

      <dsb-input
        label="Email address"
        type="email"
        formControlName="email"
        [hasError]="submitted && form.controls.email.invalid"
        errorMessage="A valid email address is required."
      />

      <dsb-dropdown
        label="Role"
        [options]="roleOptions"
        formControlName="role"
        [hasError]="submitted && form.controls.role.invalid"
        errorMessage="Role is required."
      />

      <div class="status-row">
        <span class="field-label">Status</span>
        <dsb-tag [variant]="statusTagVariant(member.status)" size="sm">{{ member.status }}</dsb-tag>
      </div>
    </form>
  }

  <div modal-footer class="edit-footer">
    <dsb-button variant="danger" (click)="requestDelete()">Delete user</dsb-button>
    <div class="edit-footer-right">
      <dsb-button variant="secondary" (click)="cancel()">Cancel</dsb-button>
      <dsb-button variant="primary" (click)="onSubmit()">Save changes</dsb-button>
    </div>
  </div>
</dsb-modal>
