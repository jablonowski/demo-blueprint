<div class="auth-shell">
  <div class="auth-card">
    <h1 class="auth-heading">Welcome back</h1>
    <p class="auth-subtitle">Sign in to your account to continue</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
      <dsb-input
        label="Username"
        placeholder="Enter your username"
        formControlName="username"
        [hasError]="submitted && usernameControl.invalid"
        errorMessage="Username is required."
      />

      <dsb-input
        label="Password"
        type="password"
        placeholder="Enter your password"
        formControlName="password"
        [hasError]="submitted && (passwordControl.invalid || credentialsError)"
        [errorMessage]="credentialsError ? 'Invalid username or password.' : 'Password is required.'"
      />

      <div class="auth-row">
        <dsb-checkbox label="Remember me" />
        <a class="auth-link" href="javascript:void(0)">Forgot password?</a>
      </div>

      <dsb-button type="submit" variant="primary" [fullWidth]="true">Sign In</dsb-button>
    </form>

    <p class="auth-signup">
      Don't have an account? <a class="auth-link" href="javascript:void(0)">Sign up</a>
    </p>
  </div>
</div>
