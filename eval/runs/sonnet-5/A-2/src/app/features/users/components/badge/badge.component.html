<span
  class="badge"
  [class.badge--success]="resolvedTone === 'success'"
  [class.badge--warning]="resolvedTone === 'warning'"
  [class.badge--danger]="resolvedTone === 'danger'"
  [class.badge--info]="resolvedTone === 'info'"
  [class.badge--neutral]="resolvedTone === 'neutral'"
>{{ text }}</span>
