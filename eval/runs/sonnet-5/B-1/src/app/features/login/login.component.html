<div class="auth-page">
  <div class="login-card">
    <h1 class="login-heading">Welcome back</h1>
    <p class="login-subtitle">Sign in to your account to continue</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form" novalidate>
      <dsb-input
        label="Username"
        placeholder="Enter your username"
        formControlName="username"
        [hasError]="username.invalid && username.touched"
        errorMessage="Username is required."
      />

      <dsb-input
        label="Password"
        type="password"
        placeholder="Enter your password"
        formControlName="password"
        [hasError]="password.invalid && password.touched"
        errorMessage="Password is required."
      />

      <div class="remember-row">
        <dsb-checkbox label="Remember me" formControlName="rememberMe" />
        <a class="text-link" href="#" (click)="$event.preventDefault()">Forgot password?</a>
      </div>

      <p *ngIf="loginFailed" class="login-error">Invalid username or password.</p>

      <dsb-button variant="primary" size="lg" [fullWidth]="true" type="submit">Sign In</dsb-button>
    </form>

    <div class="divider"></div>

    <p class="signup-row">
      Don't have an account?
      <a class="text-link" href="#" (click)="$event.preventDefault()">Sign up</a>
    </p>
  </div>
</div>
