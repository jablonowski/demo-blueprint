<div class="modal-backdrop" (click)="cancel.emit()">
  <div class="modal modal-sm" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2 class="modal-title">Confirm Deletion</h2>
      <button type="button" class="modal-close" (click)="cancel.emit()">✕</button>
    </div>
    <div class="modal-body">
      <p>
        Are you sure you want to remove <strong>{{ user.name }}</strong>? This action cannot be undone.
      </p>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="cancel.emit()">Cancel</button>
      <button type="button" class="btn btn-danger" (click)="confirm.emit()">Delete</button>
    </div>
  </div>
</div>
