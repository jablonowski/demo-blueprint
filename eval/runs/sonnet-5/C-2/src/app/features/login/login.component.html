<div class="login-page">
  <div class="login-card">
    <h1 class="login-heading">Welcome back</h1>
    <p class="login-subtitle">Sign in to your account to continue</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <dsb-input
        label="Username"
        placeholder="Enter your username"
        formControlName="username"
        [hasError]="username.touched && username.invalid"
        errorMessage="Username is required"
      />

      <dsb-input
        label="Password"
        type="password"
        placeholder="Enter your password"
        formControlName="password"
        [hasError]="(password.touched && password.invalid) || loginError"
        [errorMessage]="loginError ? 'Invalid username or password' : 'Password is required'"
      />

      <div class="remember-row">
        <dsb-checkbox label="Remember me" />
        <a href="#" class="forgot-link" (click)="$event.preventDefault()">Forgot password?</a>
      </div>

      <dsb-button variant="primary" [fullWidth]="true" type="submit">Sign In</dsb-button>
    </form>

    <p class="signup-row">
      Don't have an account? <a href="#" (click)="$event.preventDefault()">Sign up</a>
    </p>
  </div>
</div>
