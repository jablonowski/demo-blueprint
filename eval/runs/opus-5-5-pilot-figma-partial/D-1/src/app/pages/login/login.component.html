<app-auth-layout>
  <form class="login" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <header class="login-head">
      <h1 class="login-title">Welcome back</h1>
      <p class="login-subtitle">Sign in to your account to continue</p>
    </header>

    <dsb-input
      formControlName="username"
      label="Username"
      placeholder="Enter your username"
      [hasError]="showError('username') || invalidCredentials()"
      [errorMessage]="showError('username') ? 'Username is required' : 'Invalid username or password'"
    />

    <dsb-input
      formControlName="password"
      type="password"
      label="Password"
      placeholder="Enter your password"
      [hasError]="showError('password') || invalidCredentials()"
      [errorMessage]="showError('password') ? 'Password is required' : 'Invalid username or password'"
    />

    <div class="login-row">
      <dsb-checkbox label="Remember me" />
      <a class="login-link login-link--underlined" href="#" (click)="$event.preventDefault()">Forgot password?</a>
    </div>

    <dsb-button type="submit" variant="primary" [fullWidth]="true">Sign In</dsb-button>

    <p class="login-signup">
      Don't have an account?
      <a class="login-link" href="#" (click)="$event.preventDefault()">Sign up</a>
    </p>
  </form>
</app-auth-layout>
