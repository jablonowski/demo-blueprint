<div class="shell">
  <div class="shell-header">
    <dsb-header brandName="Blueprint" logoAlt="Blueprint home" logoHref="/dashboard" [navItems]="navItems()" />

    <div class="profile">
      <button
        type="button"
        class="profile-trigger"
        aria-haspopup="menu"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="profile-menu"
        (click)="toggleMenu()"
      >
        <dsb-avatar [name]="userName" size="sm" />
        <span class="profile-name">{{ userName }}</span>
        <svg class="profile-chevron" [class.profile-chevron--open]="menuOpen()" viewBox="0 0 10 6" aria-hidden="true">
          <path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>

      @if (menuOpen()) {
        <ul id="profile-menu" class="profile-menu" role="menu" aria-label="User menu">
          <li role="none">
            <button type="button" role="menuitem" class="profile-menu-item" (click)="openProfile()">My Profile</button>
          </li>
          <li role="none" class="profile-menu-separator" aria-hidden="true"></li>
          <li role="none">
            <button type="button" role="menuitem" class="profile-menu-item profile-menu-item--danger" (click)="signOut()">Sign Out</button>
          </li>
        </ul>
      }
    </div>
  </div>

  <main class="shell-main">
    <div class="shell-grid">
      <router-outlet />
    </div>
  </main>

  <dsb-footer
    brandName="Blueprint"
    logoHref="/dashboard"
    [columns]="footerColumns"
    [copyright]="copyright"
    [legalLinks]="legalLinks"
  />
</div>
