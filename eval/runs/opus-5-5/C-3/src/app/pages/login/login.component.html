<main class="auth-shell">
  <section class="auth-card" aria-labelledby="login-heading">
    <header class="auth-card__intro">
      <h1 id="login-heading" class="auth-card__heading">Welcome back</h1>
      <p class="auth-card__subtitle">Sign in to your account to continue</p>
    </header>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <dsb-input
        formControlName="username"
        label="Username"
        placeholder="Enter your username"
        [hasError]="showError('username') || invalidCredentials()"
        [errorMessage]="showError('username') ? 'Username is required' : ''"
      />

      <dsb-input
        formControlName="password"
        type="password"
        label="Password"
        placeholder="Enter your password"
        [hasError]="showError('password') || invalidCredentials()"
        [errorMessage]="
          showError('password') ? 'Password is required' : invalidCredentials() ? 'Invalid username or password' : ''
        "
      />

      <div class="auth-form__row">
        <dsb-checkbox label="Remember me" />
        <a class="auth-link auth-link--underlined" href="#" (click)="$event.preventDefault()">Forgot password?</a>
      </div>

      <dsb-button type="submit" variant="primary" size="lg" [fullWidth]="true">Sign In</dsb-button>

      <p class="auth-form__signup">
        Don't have an account?
        <a class="auth-link" href="#" (click)="$event.preventDefault()">Sign up</a>
      </p>
    </form>
  </section>
</main>
