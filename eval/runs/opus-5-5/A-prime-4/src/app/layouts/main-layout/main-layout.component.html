<div class="shell">
  <header class="header">
    <a class="brand" routerLink="/dashboard">
      <span class="logo" aria-hidden="true"><span></span></span>
      Blueprint
    </a>

    <nav class="nav" aria-label="Primary">
      <a routerLink="/dashboard" routerLinkActive="active">Overview</a>
      <a routerLink="/users" routerLinkActive="active">Team</a>
      <a href="#" (click)="$event.preventDefault()">Metrics</a>
      <a href="#" (click)="$event.preventDefault()">Logs</a>
      <a href="#" (click)="$event.preventDefault()">Settings</a>
    </nav>

    <div class="profile" #profile>
      <button type="button" class="profile-trigger" (click)="toggleMenu()"
              aria-haspopup="menu" [attr.aria-expanded]="menuOpen()">
        <span class="avatar avatar-sm">AU</span>
        <span class="profile-name">{{ userName }}</span>
        <span class="caret" [class.open]="menuOpen()" aria-hidden="true">▾</span>
      </button>

      @if (menuOpen()) {
        <div class="menu" role="menu">
          <button type="button" role="menuitem" class="menu-item" (click)="menuOpen.set(false)">My Profile</button>
          <div class="menu-divider"></div>
          <button type="button" role="menuitem" class="menu-item danger" (click)="signOut()">Sign Out</button>
        </div>
      }
    </div>
  </header>

  <main class="main">
    <div class="container">
      <router-outlet />
    </div>
  </main>

  <footer class="footer">
    <div class="footer-top">
      <div class="footer-brand">
        <span class="brand">
          <span class="logo" aria-hidden="true"><span></span></span>
          Blueprint
        </span>
        <p class="footer-copy">© {{ year }} Blueprint. All rights reserved.</p>
      </div>
      <div class="footer-cols">
        @for (col of footerColumns; track col.title) {
          <div class="footer-col">
            <span class="footer-col-title">{{ col.title }}</span>
            @for (link of col.links; track link) {
              <a href="#" (click)="$event.preventDefault()">{{ link }}</a>
            }
          </div>
        }
      </div>
    </div>
    <div class="footer-bottom">
      <a href="#" (click)="$event.preventDefault()">Privacy Policy</a>
      <a href="#" (click)="$event.preventDefault()">Terms of Service</a>
      <a href="#" (click)="$event.preventDefault()">Cookie Policy</a>
    </div>
  </footer>
</div>
