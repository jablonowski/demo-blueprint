<header class="header">
  <a class="header__brand" routerLink="/dashboard" aria-label="Blueprint home">
    <app-logo />
  </a>

  <nav class="header__nav" aria-label="Primary">
    @for (item of navItems; track item.link) {
      <a class="header__link" [routerLink]="item.link" routerLinkActive="is-active">{{ item.label }}</a>
    }
  </nav>

  <div class="profile">
    <button
      type="button"
      class="profile__trigger"
      aria-haspopup="menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <app-avatar [name]="userName" />
      <span class="profile__name">{{ userName }}</span>
      <svg class="profile__chevron" [class.is-open]="menuOpen()" viewBox="0 0 10 6" aria-hidden="true">
        <path d="M1 1l4 4 4-4" />
      </svg>
    </button>

    @if (menuOpen()) {
      <div class="profile__menu" role="menu">
        <button type="button" class="profile__item" role="menuitem" (click)="menuOpen.set(false)">My Profile</button>
        <div class="profile__divider" role="separator"></div>
        <button type="button" class="profile__item profile__item--danger" role="menuitem" (click)="selectSignOut()">
          Sign Out
        </button>
      </div>
    }
  </div>
</header>
