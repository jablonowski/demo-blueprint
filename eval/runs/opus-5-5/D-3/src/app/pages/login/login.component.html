<app-auth-layout>
  <header class="intro">
    <h1 class="title">Welcome back</h1>
    <p class="subtitle">Sign in to your account to continue</p>
  </header>

  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <dsb-input
      label="Username"
      placeholder="Enter your username"
      formControlName="username"
      [hasError]="showError('username') || credentialsRejected()"
      [errorMessage]="showError('username') ? 'Username is required' : 'Invalid username or password'"
    />

    <dsb-input
      label="Password"
      type="password"
      placeholder="Enter your password"
      formControlName="password"
      [hasError]="showError('password')"
      errorMessage="Password is required"
    />

    <div class="remember-row">
      <dsb-checkbox label="Remember me" />
      <a class="text-link" href="#" (click)="$event.preventDefault()">Forgot password?</a>
    </div>

    <dsb-button type="submit" variant="primary" size="lg" [fullWidth]="true">Sign In</dsb-button>
  </form>

  <p class="signup">
    Don't have an account?
    <a class="text-link" href="#" (click)="$event.preventDefault()">Sign up</a>
  </p>
</app-auth-layout>
