<div class="shell">
  <header class="header">
    <a routerLink="/dashboard" class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 20 20" width="20" height="20">
          <rect width="20" height="20" rx="4" fill="currentColor" />
          <path d="M6 5h5a3 3 0 0 1 1.6 5.5A3 3 0 0 1 11 16H6z" style="fill: var(--color-surface-card)" />
        </svg>
      </span>
      Blueprint
    </a>

    <nav class="nav" aria-label="Primary">
      <a routerLink="/dashboard" routerLinkActive="active">Overview</a>
      <a routerLink="/users" routerLinkActive="active">Team Members</a>
      <a href="#" (click)="$event.preventDefault()">Metrics</a>
      <a href="#" (click)="$event.preventDefault()">Settings</a>
    </nav>

    <div class="profile">
      <button
        type="button"
        class="profile-trigger"
        aria-haspopup="menu"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <span class="avatar">AU</span>
        <span class="profile-name">{{ userName }}</span>
        <span class="caret" [class.open]="menuOpen()" aria-hidden="true">▾</span>
      </button>

      @if (menuOpen()) {
        <div class="menu" role="menu">
          <button type="button" role="menuitem" class="menu-item" (click)="menuOpen.set(false)">
            My Profile
          </button>
          <div class="menu-divider"></div>
          <button type="button" role="menuitem" class="menu-item danger" (click)="signOut()">
            Sign Out
          </button>
        </div>
      }
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>

  <footer class="footer">
    <div class="footer-top">
      <div class="footer-brand">
        <span class="brand-name">Blueprint</span>
        <span class="copyright">© {{ year }} Blueprint. All rights reserved.</span>
      </div>
      <div class="footer-cols">
        @for (col of footerColumns; track col.title) {
          <div class="footer-col">
            <span class="footer-col-title">{{ col.title }}</span>
            @for (link of col.links; track link) {
              <a href="#" (click)="$event.preventDefault()">{{ link }}</a>
            }
          </div>
        }
      </div>
    </div>
    <div class="footer-legal">
      @for (link of legalLinks; track link) {
        <a href="#" (click)="$event.preventDefault()">{{ link }}</a>
      }
    </div>
  </footer>
</div>
