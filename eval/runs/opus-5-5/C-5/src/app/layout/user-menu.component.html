<div class="user-menu">
  <button
    type="button"
    class="user-trigger"
    aria-haspopup="menu"
    [attr.aria-expanded]="open"
    aria-controls="user-menu-panel"
    (click)="toggle()"
  >
    <dsb-avatar [name]="name()" size="sm" />
    <span class="user-name">{{ name() }}</span>
    <svg class="user-chevron" [class.user-chevron--open]="open" viewBox="0 0 10 6" fill="none" aria-hidden="true">
      <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  @if (open) {
    <ul id="user-menu-panel" class="user-panel" role="menu" aria-label="Account">
      <li role="none">
        <button type="button" role="menuitem" class="user-item" (click)="choose('profile')">My Profile</button>
      </li>
      <li role="none">
        <button type="button" role="menuitem" class="user-item" (click)="choose('signOut')">Sign Out</button>
      </li>
    </ul>
  }
</div>
