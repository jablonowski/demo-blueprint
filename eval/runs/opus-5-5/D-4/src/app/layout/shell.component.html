<div class="shell">
  <div class="shell-header" (click)="onShellLinkClick($event)">
    <dsb-header
      brandName="Blueprint"
      logoAlt="Blueprint home"
      logoHref="/dashboard"
      [navItems]="navItems()"
    />

    <div class="shell-header-overlay">
      <div class="profile">
        <button
          type="button"
          class="profile-trigger"
          aria-haspopup="menu"
          [attr.aria-expanded]="menuOpen()"
          aria-controls="profile-menu"
          (click)="toggleMenu()"
        >
          <dsb-avatar [name]="userName" size="sm" />
          <span class="profile-name">{{ userName }}</span>
          <svg class="profile-chevron" [class.profile-chevron--open]="menuOpen()" viewBox="0 0 10 6" aria-hidden="true">
            <path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        @if (menuOpen()) {
          <div id="profile-menu" class="profile-menu" role="menu" aria-label="Account">
            <button type="button" class="profile-menu-item" role="menuitem" (click)="goToProfile()">My Profile</button>
            <button type="button" class="profile-menu-item" role="menuitem" (click)="signOut()">Sign Out</button>
          </div>
        }
      </div>
    </div>
  </div>

  <main class="shell-main">
    <router-outlet />
  </main>

  <div (click)="onShellLinkClick($event)">
    <dsb-footer
      brandName="Blueprint"
      logoHref="/dashboard"
      tagline="Infrastructure monitoring and team management."
      [columns]="footerColumns"
      [copyright]="copyright"
      [legalLinks]="legalLinks"
    />
  </div>
</div>
