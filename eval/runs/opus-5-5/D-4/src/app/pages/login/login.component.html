<div class="auth">
  <div class="auth-card">
    <header class="auth-head">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your account to continue</p>
    </header>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <dsb-input
        formControlName="username"
        label="Username"
        placeholder="Enter your username"
        [hasError]="showError('username')"
        errorMessage="Username is required"
      />

      <dsb-input
        formControlName="password"
        type="password"
        label="Password"
        placeholder="Enter your password"
        [hasError]="showError('password') || invalidCredentials()"
        [errorMessage]="passwordError()"
      />

      <div class="auth-row">
        <dsb-checkbox label="Remember me" />
        <a href="#" class="auth-link auth-link--underline" (click)="$event.preventDefault()">Forgot password?</a>
      </div>

      <dsb-button type="submit" variant="primary" size="lg" [fullWidth]="true">Sign In</dsb-button>
    </form>

    <p class="auth-signup">
      Don't have an account?
      <a href="#" class="auth-link" (click)="$event.preventDefault()">Sign up</a>
    </p>
  </div>
</div>
