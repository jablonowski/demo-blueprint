<div class="profile">
  <button
    type="button"
    class="profile-trigger"
    aria-haspopup="menu"
    [attr.aria-expanded]="open"
    aria-controls="profile-menu"
    (click)="toggle()"
  >
    <dsb-avatar [name]="name" size="sm" />
    <span class="profile-name">{{ name }}</span>
    <svg
      class="profile-chevron"
      [class.profile-chevron--open]="open"
      viewBox="0 0 10 6"
      fill="none"
      aria-hidden="true"
    >
      <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  @if (open) {
    <ul id="profile-menu" class="profile-menu" role="menu" aria-label="Account">
      <li role="none">
        <button type="button" role="menuitem" class="profile-item" (click)="close()">My Profile</button>
      </li>
      <li role="none">
        <button type="button" role="menuitem" class="profile-item" (click)="onSignOut()">Sign Out</button>
      </li>
    </ul>
  }
</div>
