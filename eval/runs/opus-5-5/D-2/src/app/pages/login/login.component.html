<main class="auth-shell">
  <section class="login-card" aria-labelledby="login-heading">
    <header class="login-intro">
      <h1 id="login-heading" class="login-heading">Welcome back</h1>
      <p class="login-subtitle">Sign in to your account to continue</p>
    </header>

    <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <dsb-input
        formControlName="username"
        label="Username"
        placeholder="Enter your username"
        [hasError]="showError('username') || !!credentialsError"
        [errorMessage]="showError('username') ? 'Username is required' : credentialsError"
      />

      <dsb-input
        formControlName="password"
        type="password"
        label="Password"
        placeholder="Enter your password"
        [hasError]="showError('password')"
        errorMessage="Password is required"
      />

      <div class="login-options">
        <dsb-checkbox label="Remember me" />
        <a href="#" class="text-link" (click)="$event.preventDefault()">Forgot password?</a>
      </div>

      <dsb-button type="submit" variant="primary" size="lg" [fullWidth]="true">Sign In</dsb-button>
    </form>

    <p class="login-signup">
      Don't have an account?
      <a href="#" class="text-link" (click)="$event.preventDefault()">Sign up</a>
    </p>
  </section>
</main>
