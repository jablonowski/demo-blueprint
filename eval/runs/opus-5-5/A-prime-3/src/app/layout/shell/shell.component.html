<div class="shell">
  <header class="header">
    <a class="brand" routerLink="/dashboard">
      <svg class="logo" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
        <rect x="1" y="1" width="20" height="20" rx="5" fill="currentColor" />
        <rect x="6" y="6" width="4" height="10" rx="1" class="logo-mark" />
        <rect x="12" y="6" width="4" height="4" rx="1" class="logo-mark" />
        <rect x="12" y="12" width="4" height="4" rx="1" class="logo-mark" />
      </svg>
      <span class="brand-name">Blueprint</span>
    </a>

    <nav class="nav" aria-label="Primary">
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/users" routerLinkActive="active">Users</a>
    </nav>

    <div class="profile">
      <button type="button" class="profile-trigger" (click)="toggleMenu()"
              aria-haspopup="menu" [attr.aria-expanded]="menuOpen()">
        <span class="avatar">AU</span>
        <span class="profile-name">{{ userName }}</span>
        <span class="caret" [class.open]="menuOpen()" aria-hidden="true">▾</span>
      </button>
      @if (menuOpen()) {
        <div class="menu" role="menu">
          <button type="button" role="menuitem" class="menu-item" (click)="menuOpen.set(false)">My Profile</button>
          <div class="menu-sep"></div>
          <button type="button" role="menuitem" class="menu-item" (click)="signOut()">Sign Out</button>
        </div>
      }
    </div>
  </header>

  <main class="content">
    <div class="content-grid">
      <router-outlet />
    </div>
  </main>

  <footer class="footer">
    <div class="footer-top">
      <div class="footer-brand">
        <span class="brand-name">Blueprint</span>
        <span class="footer-copy">© {{ year }} Blueprint. All rights reserved.</span>
      </div>
      <div class="footer-cols">
        @for (col of footerColumns; track col.title) {
          <div class="footer-col">
            <span class="footer-col-title">{{ col.title }}</span>
            @for (link of col.links; track link) {
              <a href="" (click)="$event.preventDefault()">{{ link }}</a>
            }
          </div>
        }
      </div>
    </div>
    <div class="footer-legal">
      <a href="" (click)="$event.preventDefault()">Privacy Policy</a>
      <a href="" (click)="$event.preventDefault()">Terms of Service</a>
      <a href="" (click)="$event.preventDefault()">Cookie Policy</a>
    </div>
  </footer>
</div>
